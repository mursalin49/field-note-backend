server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fieldnotes}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none          # schema is owned by Flyway migrations
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-32+bytes}
    expiration-hours: 720
  upload-dir: ${UPLOAD_DIR:uploads}
